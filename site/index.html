:root {
  --glass: #15171A; --red: #FF4536; --green: #2FD158; --blue: #2E6BFF;
  --ease: cubic-bezier(.2, 0, 0, 1); --fast: 120ms; --base: 200ms; --off: 400ms;
  --r-control: 8px; --r-card: 14px; --r-sheet: 20px;
  --al-base: #F4F6F8; --al-raised: #FFFFFF; --al-sunken: #E9ECF0; --al-text: #101317; --al-text-2: #5B6270; --al-action: #2860F0; --al-border: #DDE1E6;
  --al-shadow: 0 8px 24px rgba(0,0,0,.18);
}
:root[data-theme="dark"] {
  --al-base: #15171A; --al-raised: #1F2226; --al-sunken: #0E1012; --al-text: #E8EAED; --al-text-2: #9AA1AD; --al-action: #6B97FF; --al-border: #2B2F35;
  --al-shadow: 0 8px 24px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html { color-scheme: light dark; scroll-behavior: smooth; }
body { margin: 0; background: var(--al-base); color: var(--al-text); overflow-x: hidden; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--al-action); outline-offset: 2px; }

/* ---- the page ---- */
.al { container-type: inline-size; font-family: "Instrument Sans", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
.al a { color: inherit; text-decoration: none; }
.al code { font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.al .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.al .ic.solid { fill: currentColor; stroke: none; }

/* the bar: the product's own, the tile of glass with the mark and the name */
.al-nav { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 32px; color: var(--al-text); background: transparent; transition: background var(--base) var(--ease), color var(--base) var(--ease); margin-bottom: -64px; }
.al-nav[data-glass] { background: color-mix(in srgb, var(--al-base) 86%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.al[data-lit] .al-nav:not([data-glass]) { color: #E8EAED; }
.al-nav .brand { display: inline-flex; align-items: center; gap: 12px; font-stretch: 75%; font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.al-nav .brand .tile { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: rgba(21,23,26,.86); border: 1px solid rgba(232,234,237,.14); }
.al-nav .brand .tile svg { width: 20px; height: 20px; }
.al-nav .links { display: flex; align-items: center; gap: 4px; }
.al-nav .links a, .al-nav .links button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--r-control); border: 0; background: transparent; color: inherit; font-size: 15px; cursor: pointer; transition: background var(--fast) var(--ease); }
.al-nav .links a:hover, .al-nav .links button:hover { background: rgba(127,135,145,.18); }
.al-nav .sep { width: 1px; height: 20px; background: currentColor; opacity: .25; margin: 0 6px; }

/* the hero: the glass, and the screen that lights as the page scrolls */
.al-track { position: relative; height: 320vh; height: 320svh; }
.al-stick { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--al-base); color: var(--al-text); }
.al[data-lit] .al-stick { background: var(--glass); color: #E8EAED; }
.al-stick .picture { position: absolute; inset: 0; background: var(--glass); transform-origin: 50% 50%; overflow: hidden; }
.al-stick .picture iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.al-stick canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.al-stick .name { position: absolute; left: 32px; right: 32px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.al-stick .name h1 { margin: 0 0 6px -0.04em; font-stretch: 75%; font-weight: 600; font-size: 17cqw; line-height: .86; letter-spacing: -.03em; }
.al-stick .name p { margin: 0; max-width: 36ch; font-size: 24px; }
.al-stick .acts { display: flex; gap: 12px; margin-top: 28px; pointer-events: auto; }
.al-stick .cue { position: absolute; left: 32px; bottom: 22px; font-size: 13px; color: var(--al-text-2); }
.al[data-lit] .al-stick .cue { color: #9AA1AD; }
.al-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-control); font-size: 15px; font-weight: 500; border: 1px solid var(--al-border); color: var(--al-text); background: var(--al-raised); cursor: pointer; transition: background var(--fast) var(--ease), transform var(--fast) var(--ease); }
.al-btn:hover { background: var(--al-sunken); }
.al-btn:active { transform: translateY(1px); }
.al-btn--primary, .al-btn--primary:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
.al-btn--primary:hover { background: #4B7FFF; }
.al-btn svg { width: 18px; height: 18px; }
.al[data-lit] .al-stick .al-btn:not(.al-btn--primary) { border-color: rgba(232,234,237,.35); color: #F4F6F8; background: rgba(21,23,26,.5); }

/* the sections */
.al-main { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
.al-sec { padding: 96px 0 24px; }
.al-sec h2 { margin: 0 0 14px; font-stretch: 75%; font-weight: 600; font-size: 56px; line-height: .95; letter-spacing: -.025em; max-width: 14ch; }
.al-sec .lead { margin: 0; max-width: 54ch; font-size: 20px; }
.al-sec .note { margin: 10px 0 0; max-width: 54ch; font-size: 15px; color: var(--al-text-2); }
.al-sec .head { display: grid; grid-template-columns: 1fr 1.2fr; gap: 32px; align-items: end; margin-bottom: 36px; }
.frame { position: relative; border-radius: var(--r-sheet); overflow: hidden; background: var(--al-raised); border: 1px solid var(--al-border); box-shadow: var(--al-shadow); }
.frame img { display: block; width: 100%; height: auto; }
.frame + .frame { margin-top: 24px; }
.phones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: start; }
.phones figure { margin: 0; display: grid; justify-items: center; }
.phones .frame { border-radius: 28px; width: 100%; max-width: 268px; }
.phones figure:nth-child(2) { margin-top: 56px; }
.phones figure:nth-child(3) { margin-top: 20px; }
.phones figcaption { margin: 14px 0 0; max-width: 268px; font-size: 15px; color: var(--al-text-2); }
.places { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; }
.places svg.wire { position: absolute; left: 0; right: 0; top: 46px; width: 100%; height: 8px; overflow: visible; pointer-events: none; }
.places .wire path { fill: none; stroke: var(--al-border); stroke-width: 2; }
.places .wire .light { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 60 2000; stroke-dashoffset: 60; }
@keyframes travel { from { stroke-dashoffset: 60; } to { stroke-dashoffset: -2000; } }
.place { position: relative; padding: 28px 24px 24px; border-radius: var(--r-sheet); background: var(--al-raised); border: 1px solid var(--al-border); min-height: 190px; }
.place b { display: block; font-stretch: 75%; font-size: 30px; font-weight: 600; margin-bottom: 8px; line-height: 1; }
.place span { color: var(--al-text-2); font-size: 15px; }
.place .mark { position: absolute; top: 22px; right: 22px; width: 28px; height: 28px; }
.place.glass { background: var(--glass); color: #E8EAED; border-color: #2A2F35; background-image: repeating-linear-gradient(90deg, rgba(255,69,54,.18) 0 1px, transparent 1px 2px, rgba(47,209,88,.18) 2px 3px, transparent 3px 4px, rgba(46,107,255,.18) 4px 5px, transparent 5px 6px); }
.place.glass span { color: #C9CFD6; }
.ledger { border-top: 1px solid var(--al-border); }
.ledger .row:has(+ .row.cont) { border-bottom: 0; }
.ledger .row { display: grid; grid-template-columns: 1.1fr 2fr .8fr; gap: 24px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--al-border); }
.ledger .os { font-stretch: 75%; font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.ledger .os small { display: block; font-stretch: 100%; font-weight: 400; font-size: 15px; letter-spacing: 0; color: var(--al-text-2); margin-top: 6px; }
.ledger .row.cont { border-top: 0; padding-top: 0; margin-top: -8px; }
.ledger .row.cont .os small { margin-top: 0; }
.ledger .snd { display: inline-flex; align-items: center; gap: 8px; color: var(--al-text-2); font-size: 15px; justify-self: end; }
.install { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.install > div { min-width: 0; }
.code { position: relative; margin-top: 16px; border-radius: var(--r-card); background: var(--glass); color: #E8EAED; padding: 18px 20px; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: auto; border: 1px solid #2A2F35; }
.code .copy { position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--r-control); border: 1px solid rgba(232,234,237,.25); background: transparent; color: #E8EAED; font: 13px "Instrument Sans", system-ui, sans-serif; cursor: pointer; }
.code .copy:hover { background: rgba(232,234,237,.12); }
.said { display: block; margin-top: 8px; font-size: 14px; color: var(--al-text-2); min-height: 20px; }
.al-foot { margin-top: 96px; border-top: 1px solid var(--al-border); padding: 28px 32px 48px; color: var(--al-text-2); font-size: 14px; }
.al-foot .in { max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.al-foot a { color: var(--al-action); }

/* the product's page, shown live */
.frame.live { background: var(--glass); }
.frame.live iframe { display: block; width: 100%; border: 0; }
.frame.live.bar { height: 150px; }
.frame.live.bar iframe { width: 1280px; height: 160px; transform: scale(1.8); transform-origin: 50% 0; margin-left: calc((100% - 1280px) / 2); }
.phones .frame.live { height: 560px; }
.phones .frame.live iframe { width: 412px; height: 860px; transform: scale(0.6505); transform-origin: 0 0; }

<script type="x-shader/x-vertex" id="sh-v">#version 300 es
in vec2 a_corner;
void main() { gl_Position = vec4(a_corner, 0.0, 1.0); }</script>
<script type="x-shader/x-fragment" id="sh-glass">#version 300 es
precision mediump float;
uniform vec2 u_size; uniform vec2 u_pointer; uniform float u_cell; uniform float u_lens; uniform float u_grain;
uniform vec3 u_base; uniform vec3 u_red; uniform vec3 u_green; uniform vec3 u_blue;
out vec4 colour;
vec3 subpixel(vec2 at) {
  float column = mod(floor(at.x / u_cell), 3.0);
  float gap = step(0.18, fract(at.x / u_cell)) * step(0.12, fract(at.y / (u_cell * 3.0)));
  vec3 lit = column < 0.5 ? u_red : (column < 1.5 ? u_green : u_blue);
  return lit * gap;
}
void main() {
  vec2 at = vec2(gl_FragCoord.x, u_size.y - gl_FragCoord.y);
  float near = u_lens * smoothstep(240.0, 0.0, distance(at, u_pointer));
  vec3 cell = subpixel(at);
  float lit = max(cell.r, max(cell.g, cell.b));
  colour = vec4(mix(u_base, cell, step(0.001, lit) * (u_grain + 0.46 * near * near)), 1.0);
}</script>
<script type="x-shader/x-fragment" id="sh-ignite">#version 300 es
precision mediump float;
uniform vec2 u_size; uniform float u_cell; uniform float u_progress;
uniform vec3 u_base; uniform vec3 u_red; uniform vec3 u_green; uniform vec3 u_blue;
out vec4 colour;
const float SPOT = 0.03; const float LINE = 0.09; const float OPEN = 0.24;
void main() {
  vec2 at = vec2(gl_FragCoord.x, u_size.y - gl_FragCoord.y);
  vec2 from = abs(at - u_size * 0.5);
  float column = mod(floor(at.x / u_cell), 3.0);
  float gap = step(0.18, fract(at.x / u_cell)) * step(0.12, fract(at.y / (u_cell * 3.0)));
  vec3 lit = column < 0.5 ? u_red : (column < 1.5 ? u_green : u_blue);
  // The beam: a spot, then the line it is drawn out into, fading as the picture opens.
  float reach = 3.0 + smoothstep(SPOT, LINE, u_progress) * u_size.x * 0.5;
  float shows = smoothstep(0.0, SPOT, u_progress) * (1.0 - smoothstep(LINE + 0.02, OPEN, u_progress));
  float beam = shows * (1.0 - smoothstep(0.0, 2.5, from.y)) * (1.0 - smoothstep(reach - 3.0, reach, from.x));
  float halo = shows * 0.35 * (1.0 - smoothstep(0.0, 14.0, from.y)) * (1.0 - smoothstep(reach - 3.0, reach + 10.0, from.x));
  // The picture opening, a colour at a time, and warming once it is open.
  float opened = smoothstep(LINE, OPEN, u_progress - column * 0.02) * u_size.y * 0.56;
  float inside = step(LINE, u_progress) * (1.0 - smoothstep(opened - 2.0, opened + 2.0, from.y));
  float warm = 0.26 + 0.34 * smoothstep(OPEN, 1.0, u_progress);
  vec3 grid = lit * gap * (0.035 + warm * inside);
  vec3 light = (u_red + u_green + u_blue) * (beam * 0.62 + halo * 0.3);
  colour = vec4(u_base + grid + light, 1.0);
}</script>
<script type="x-shader/x-fragment" id="sh-dissolve">#version 300 es
precision mediump float;
uniform vec2 u_size; uniform float u_cell; uniform float u_progress;
uniform vec3 u_base; uniform vec3 u_red; uniform vec3 u_green; uniform vec3 u_blue;
out vec4 colour;
float chance(vec2 cell) { return fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 at = vec2(gl_FragCoord.x, u_size.y - gl_FragCoord.y);
  float column = mod(floor(at.x / u_cell), 3.0);
  float gap = step(0.18, fract(at.x / u_cell)) * step(0.12, fract(at.y / (u_cell * 3.0)));
  vec3 lit = column < 0.5 ? u_red : (column < 1.5 ? u_green : u_blue);
  float stays = step(u_progress, chance(floor(at / (u_cell * 3.0))));
  colour = vec4((u_base + lit * gap * 0.635) * stays, stays);
}</script>

ass=\"cap-note\">This screen changes by itself once it is on.<\/p><div class=\"foot\"><button type=\"button\" class=\"cap\">Back<\/button><span class=\"n\">Step 2 of 5<\/span><button type=\"button\" class=\"cap dis\">Continue<\/button><\/div><\/div><\/div>"}}</script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const WORDS = JSON.parse($("al-words").textContent);
  const embed = JSON.parse($("al-embed").textContent);
  const macs = JSON.parse($("al-macs").textContent);
  const root = document.documentElement, page = $("al-page"), nav = $("al-nav");
  const state = { lang: "pt-BR", theme: root.dataset.theme === "dark" ? "dark" : "light" };
  try { state.lang = localStorage.getItem("alumia-site.lang") || state.lang; } catch {}
  if (!["pt-BR", "en-US"].includes(state.lang)) state.lang = (navigator.language || "").toLowerCase().startsWith("pt") ? "pt-BR" : "en-US";
  const reducedSystem = matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => reducedSystem.matches;
  const keep = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  function words() {
    const w = WORDS[state.lang];
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = w[el.dataset.t];
    for (const el of document.querySelectorAll("[data-t-aria]")) el.setAttribute("aria-label", w[el.dataset.tAria]);
    root.lang = state.lang;
    document.title = w.title;
    document.querySelector('meta[name="description"]').content = w["hero.line"];
    $("al-changes").href = embed.repo + (state.lang === "pt-BR" ? "/blob/main/CHANGELOG.pt-BR.md" : "/blob/main/CHANGELOG.md");
  }
  // The product's page, live: its document and stylesheet as the gateway served them, in
  // the theme and the language chosen here, with the glass and its lens drawn by the
  // product's own shader.
  const doc = (kind, theme, lang) => {
    const l = lang === "pt-BR" ? "pt" : "en";
    const head = embed.head.replace("__CSS__", embed.css).replace("{lang}", lang).replace("{theme}", theme).replace("{shader}", embed.shader);
    return head + embed.docs[`${kind}-${l}`] + embed.runner + "</body></html>";
  };
  function pictures() {
    const l = state.lang === "pt-BR" ? "pt" : "en", t = state.theme;
    $("al-hero-frame").srcdoc = doc("list", t, state.lang);
    for (const f of document.querySelectorAll("iframe[data-doc]")) f.srcdoc = doc(f.dataset.doc, t, state.lang);
    for (const m of document.querySelectorAll("[data-mac]")) m.innerHTML = macs[state.lang][m.dataset.mac];
    const map = { ignite: `real/acende-${l}.png`, "ignite-phone": `real/celular-acende-${l}.png` };
    for (const img of document.querySelectorAll("[data-pic]")) img.src = map[img.dataset.pic];
    document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue("--al-base").trim();
  }
  function apply() {
    root.dataset.theme = state.theme;
    words(); pictures();
    $("al-light").style.animation = reduced() ? "none" : "travel 9s linear infinite";
    hero.start();
  }
  $("al-lang").addEventListener("click", () => { state.lang = state.lang === "pt-BR" ? "en-US" : "pt-BR"; keep("alumia-site.lang", state.lang); apply(); });
  $("al-theme").addEventListener("click", () => { state.theme = state.theme === "dark" ? "light" : "dark"; keep("alumia-site.theme", state.theme); apply(); });
  $("al-copy").addEventListener("click", async () => {
    const text = $("al-code").innerText.replace(/^.*?\n/, "");
    try { await navigator.clipboard.writeText(text); $("al-said").textContent = WORDS[state.lang]["code.copied"]; }
    catch { $("al-said").textContent = WORDS[state.lang]["code.refused"]; }
    setTimeout(() => { $("al-said").textContent = ""; }, 4000);
  });

  // ---- the hero: the glass of the theme with its lens; the screen that lights as the
  // page scrolls (the dark glass); the grid that dissolves over the product's page ----
  const hero = (() => {
    const canvas = $("al-fx"), stick = $("top"), track = $("al-track"), picture = $("al-picture"), name = $("al-name"), cue = $("al-cue");
    let gl = null, programs = {}, frame = 0, running = false;
    let pointer = [-1000, -1000], lens = 0, lensTo = 0;
    let shown = 0, target = 0;
    const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
    const BRAND = { u_red: hex(embed.colours.red), u_green: hex(embed.colours.green), u_blue: hex(embed.colours.blue) };
    const CELL = embed.cell, GRAIN = embed.grain;
    const SURFACE = { dark: hex(embed.colours.dark), light: hex(embed.colours.light) }, GLASS = hex(embed.colours.glass);
    function compile(n) {
      const make = (type, id) => { const s = gl.createShader(type); gl.shaderSource(s, $(id).textContent.trim()); gl.compileShader(s); return s; };
      const p = gl.createProgram();
      gl.attachShader(p, make(gl.VERTEX_SHADER, "sh-v")); gl.attachShader(p, make(gl.FRAGMENT_SHADER, `sh-${n}`)); gl.linkProgram(p);
      const u = {}; for (const k of ["u_size", "u_pointer", "u_cell", "u_lens", "u_grain", "u_progress", "u_base", "u_red", "u_green", "u_blue"]) u[k] = gl.getUniformLocation(p, k);
      return { p, u };
    }
    function init() {
      gl = canvas.getContext("webgl2", { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
      if (!gl) return false;
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      for (const n of ["glass", "ignite", "dissolve"]) {
        programs[n] = compile(n); gl.useProgram(programs[n].p);
        const a = gl.getAttribLocation(programs[n].p, "a_corner"); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
        for (const [k, v] of Object.entries(BRAND)) gl.uniform3fv(programs[n].u[k], v);
        gl.uniform1f(programs[n].u.u_cell, CELL);
      }
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      return true;
    }
    function size() {
      const w = stick.clientWidth, h = stick.clientHeight;
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); for (const n in programs) { gl.useProgram(programs[n].p); gl.uniform2f(programs[n].u.u_size, w, h); } }
    }
    // 0 to 0.02: the glass of the theme, with the lens; 0.02 to 0.42: the screen lights
    // (the beam, the picture opening, the warmth); 0.42 to 0.8: the grid dissolves over the
    // page; 0.8 to 1: the page settles into a frame and the bar takes the glass.
    function paint(p) {
      size();
      const lit = p > 0.02;
      page.toggleAttribute("data-lit", lit);
      if (!lit) {
        const g = programs.glass; gl.useProgram(g.p);
        gl.uniform3fv(g.u.u_base, SURFACE[state.theme]);
        gl.uniform2f(g.u.u_pointer, pointer[0], pointer[1]); gl.uniform1f(g.u.u_lens, lens); gl.uniform1f(g.u.u_grain, GRAIN[state.theme]);
        gl.disable(gl.BLEND); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.enable(gl.BLEND);
      } else if (p < 0.42) {
        // The beam and the picture opening (up to the shader's OPEN, 0.24) take most of
        // the scroll; the warmth that follows, the rest.
        const s = Math.min(1, (p - 0.02) / 0.4);
        const q = reduced() ? 0.62 : (s < 0.65 ? (s / 0.65) * 0.24 : 0.24 + ((s - 0.65) / 0.35) * 0.76);
        const g = programs.ignite; gl.useProgram(g.p);
        gl.uniform3fv(g.u.u_base, GLASS); gl.uniform1f(g.u.u_progress, q);
        gl.disable(gl.BLEND); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.enable(gl.BLEND);
      } else {
        const q = Math.min(1, (p - 0.42) / 0.38);
        gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
        const g = programs.dissolve; gl.useProgram(g.p);
        gl.uniform3fv(g.u.u_base, GLASS); gl.uniform1f(g.u.u_progress, q);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      const fade = 1 - Math.min(1, Math.max(0, (p - 0.24) / 0.16));
      name.style.opacity = fade; name.style.transform = `translateY(-50%) scale(${0.97 + 0.03 * fade})`;
      name.style.pointerEvents = fade < 0.5 ? "none" : "";
      cue.style.opacity = reduced() ? 0 : Math.max(0, 1 - p / 0.06);
      const settle = Math.min(1, Math.max(0, (p - 0.8) / 0.2));
      const ease = 1 - Math.pow(1 - settle, 3);
      picture.style.transform = `translateY(${40 * ease}px) scale(${1 - 0.1 * ease})`; picture.style.borderRadius = `${20 * ease}px`;
      stick.style.background = ease > 0 ? `color-mix(in srgb, var(--glass) ${100 - 100 * ease}%, var(--al-base))` : "";
      nav.toggleAttribute("data-glass", p > 0.6);
    }
    function progress() {
      const top = track.offsetTop, h = track.offsetHeight - stick.offsetHeight;
      return Math.min(1, Math.max(0, (window.scrollY - top) / Math.max(1, h)));
    }
    function tick() {
      frame = 0;
      target = progress();
      shown += (target - shown) * 0.16;
      lens += (lensTo - lens) * 0.2;
      if (Math.abs(target - shown) < 0.0005) shown = target;
      if (Math.abs(lensTo - lens) < 0.001) lens = lensTo;
      paint(shown);
      if (running && (shown !== target || lens !== lensTo)) frame = requestAnimationFrame(tick);
    }
    const wake = () => {
      if (!running) return;
      if (reduced()) { shown = target = progress(); paint(shown); return; }
      if (!frame) frame = requestAnimationFrame(tick);
    };
    window.addEventListener("scroll", wake, { passive: true });
    window.addEventListener("resize", wake);
    stick.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse") return; const r = stick.getBoundingClientRect(); pointer = [e.clientX - r.left, e.clientY - r.top]; lensTo = 1; wake(); });
    stick.addEventListener("pointerleave", () => { lensTo = 0; wake(); });
    return {
      start() {
        running = true;
        if (!gl && !init()) { canvas.style.display = "none"; page.toggleAttribute("data-lit", progress() > 0.02); return; }
        shown = target = progress(); lens = reduced() ? 0 : lens; paint(shown); wake();
      },
    };
  })();
  apply();
})();
</script>
</body>
</html>
