name: Release alumia

# The native packages and the container images of one version. In the public repository,
# aleonnet/alumia, it is the release: dispatched on the version's commit, after
# tools/publish-public.sh (in aleonnet/alumia-app, where the work is) has pushed that commit
# with its tag and created the release with the Mac app's disk image, it asks that the tag
# name the commit it runs on and that the release exist, builds the packages, and attaches
# them to that release.
#
# Anywhere else it is the rehearsal of that: aleonnet/alumia-app above all, dispatched on the
# branch a version is being made on, before the version is tagged. The same jobs build, install
# and test every package and both images, and the steps that publish do not run: no tag and
# no release are asked for, nothing is attached, nothing is pushed to the registry. There is
# no input to choose with: a release belongs to the public repository and nowhere else, and
# a version's packages are that version's commit's, so what does not build has to be found
# before the commit is published (docs/release.md).
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/aleonnet/alumia

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      rehearsal: ${{ steps.where.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v4

      - name: The release, or its rehearsal
        id: where
        run: |
          if [ "$GITHUB_REPOSITORY" = "aleonnet/alumia" ]; then
            echo "rehearsal=false" >> "$GITHUB_OUTPUT"
          else
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A rehearsal: every package and image is built and tested, and nothing is published. The release is made in aleonnet/alumia alone."
          fi

      - name: Determine and validate version
        id: version
        run: |
          # Real TOML parse + semver check, not grep/sed (see also packaging/build-tarball.sh).
          # Plain python3 (3.11+ for tomllib): uv is for local dev, not the CI runners.
          VERSION=$(python3 -c '
          import re, sys, tomllib
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              sys.exit(f"invalid version in Cargo.toml: {version!r}")
          print(version)
          ')
          TAG="v${VERSION}"
          echo "Release tag: ${TAG}"
          IS_PRERELEASE="false"
          [ "$GITHUB_REF_NAME" = "main" ] || IS_PRERELEASE="true"
          # The bare version (no leading v) is the tarball/container filename
          # component and the Dockerfile's VERSION build-arg.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      # The version's tag is made by tools/publish-public.sh on the version's commit, which
      # is the one this has to be dispatched on: the packages built here are that commit's.
      - name: The tag names this commit
        if: steps.where.outputs.rehearsal == 'false'
        run: |
          # The tag as an explicit refspec: `tag <name>` would be two arguments, and a
          # quoted "tag v0.1.3" is one, which git refuses as an invalid refspec.
          git fetch --no-tags origin "refs/tags/${{ steps.version.outputs.tag }}:refs/tags/${{ steps.version.outputs.tag }}" \
            || { echo "::error::there is no tag ${{ steps.version.outputs.tag }}: tools/publish-public.sh makes it when it publishes the version."; exit 1; }
          tagged=$(git rev-parse "${{ steps.version.outputs.tag }}^{commit}")
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::${{ steps.version.outputs.tag }} names $tagged, and this runs on $GITHUB_SHA: dispatch it on the version's commit."
            exit 1
          fi

      # The release exists before this runs, made by tools/publish-public.sh with the Mac
      # app's disk image attached; the packages built here are added to it.
      - name: The release exists
        if: steps.where.outputs.rehearsal == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "${{ steps.version.outputs.tag }}" --json isDraft --jq '.isDraft') \
            || { echo "::error::there is no release ${{ steps.version.outputs.tag }}: tools/publish-public.sh creates it, with the disk image."; exit 1; }
          if [ "$draft" != "false" ]; then
            echo "::error::the release ${{ steps.version.outputs.tag }} is a draft."
            exit 1
          fi

  # The frontend bundle is platform-agnostic — built once, by the workflow that
  # builds it on every push to the frontend as well, and handed to every matrix
  # runner rather than rebuilt on each. Each runner tells build.rs to stage the
  # downloaded frontend/dist in Cargo's private OUT_DIR, from which src/assets.rs
  # compiles it into the binary.
  frontend:
    needs: prepare
    uses: ./.github/workflows/frontend-dist.yml

  build:
    needs: [prepare, frontend]
    env:
      ALUMIA_PREBUILT_FRONTEND: frontend/dist
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: these binaries set the glibc floor for
          # both the tarballs and the container images (packaging/Dockerfile runs
          # them on debian:trixie-slim, glibc 2.41), so the builder must not drift
          # under us into something newer than what can run them.
          - runner: ubuntu-26.04
            target-note: linux-x86_64
          - runner: ubuntu-26.04-arm
            target-note: linux-arm64
          - runner: macos-latest
            target-note: macos-arm64
          # The Windows native package is an MSI: the same tree under %ProgramFiles%\alumia,
          # reading %ProgramData%\alumia\alumia.toml. No container image.
          - runner: windows-latest
            target-note: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install RPM packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # jemalloc takes its page size from the build host, and a 4K build refuses to
      # start on the 16K and 64K kernels arm64 boards ship (Raspberry Pi 5). 64K pages
      # run on all three. Set for every later step, so the container binary gets it too.
      - name: Build jemalloc for large arm64 pages
        if: matrix.target-note == 'linux-arm64'
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"

      - name: Build release artifacts (${{ matrix.target-note }})
        if: runner.os != 'Windows'
        run: |
          bash packaging/build-tarball.sh
          bash packaging/build-native-packages.sh

      # The packages ask for the glibc docs/install.md promises, and the binary for the
      # newest one it was linked against: this runner's Ubuntu is newer than the oldest of
      # the promise, so the binary is read and started there before anything is uploaded.
      - name: Check the binary against the glibc floor (${{ matrix.target-note }})
        if: runner.os == 'Linux'
        run: bash tools/check-linux-floor.sh --binary target/release/alumia

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the release installer (${{ matrix.target-note }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build-windows-msi.ps1

      - name: Install, run and remove the installer (${{ matrix.target-note }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File packaging/verify-windows-msi.ps1

      - name: Build feature-minimal container gateway (${{ matrix.target-note }})
        if: runner.os == 'Linux'
        run: bash packaging/build-container-binary.sh "tmp/container-bin/alumia-container-${{ matrix.target-note }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alumia-${{ matrix.target-note }}
          path: dist/*
          if-no-files-found: error

      - name: Upload container gateway
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: alumia-container-${{ matrix.target-note }}
          path: tmp/container-bin/alumia-container-${{ matrix.target-note }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # The same globs the upload below names, in a rehearsal too: one that matches nothing
      # is found here and not at a release.
      - name: The packages the release gets
        run: ls -la artifacts/*.deb artifacts/*.rpm artifacts/*.pkg artifacts/*.msi

      - name: Upload artifacts to the release
        if: needs.prepare.outputs.rehearsal == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Named globs, not `artifacts/*`: `merge-multiple` also drops the
        # frontend-dist artifact's files in here, and those are build input, not
        # release assets, as the tarballs are: the container job takes those from the
        # workflow's artifacts. The .pkg is the native macOS gateway package, the
        # .msi the Windows one. The release already holds the Mac app's disk image.
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            artifacts/*.deb artifacts/*.rpm artifacts/*.pkg \
            artifacts/*.msi --clobber

  # Container images, built only once the release is published so a pushed image
  # tag always corresponds to a real release. Nothing is compiled here: each
  # arch's image takes the release layout from its tarball, then
  # replaces the native binary with the feature-minimal container binary built
  # on the same pinned runner from the same commit. In particular, the image can
  # never expose the managed-instance gateway surface.
  #
  # Each arch builds on its own native runner — no QEMU, no cross-compilation —
  # and plain `docker` (rather than buildx) because there is nothing to
  # cross-build and it lets the image be smoke-tested before it is pushed.
  #
  # These runners need no pinning (unlike the tarball builds above): the runner
  # only unpacks a tarball and drives docker, so all that matters is its arch —
  # the glibc that has to line up is the *base image*'s against the binary's.
  docker:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target-note: linux-x86_64
          - runner: ubuntu-26.04-arm
            arch: arm64
            target-note: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release tarball (${{ matrix.target-note }})
        uses: actions/download-artifact@v4
        with:
          name: alumia-${{ matrix.target-note }}
          path: tmp/tarball

      - name: Download the feature-minimal gateway (${{ matrix.target-note }})
        uses: actions/download-artifact@v4
        with:
          name: alumia-container-${{ matrix.target-note }}
          path: tmp/container-bin

      - name: Unpack the tarball into the build context
        run: |
          mkdir -p tmp/docker-context
          # --strip-components=1 drops the alumia-<version>/ wrapper so the
          # context root holds bin/ and share/ as packaging/Dockerfile expects.
          tar -xzf "tmp/tarball/alumia-${{ needs.prepare.outputs.version }}-${{ matrix.target-note }}.tar.gz" \
            -C tmp/docker-context --strip-components=1
          cp "tmp/container-bin/alumia-container-${{ matrix.target-note }}" \
            tmp/docker-context/bin/alumia
          chmod +x tmp/docker-context/bin/alumia
          ls -la tmp/docker-context tmp/docker-context/bin

      - uses: docker/login-action@v3
        if: needs.prepare.outputs.rehearsal == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --file packaging/Dockerfile \
            --build-arg "VERSION=${{ needs.prepare.outputs.version }}" \
            --tag "${GHCR_IMAGE}:${IMAGE_TAG}" \
            tmp/docker-context

      - name: Smoke test the image
        run: |
          # Proves the release binary actually runs on this base image (a glibc
          # mismatch would only ever surface here) and that the image contents
          # match the release being published.
          got=$(docker run --rm "${GHCR_IMAGE}:${IMAGE_TAG}" --version)
          echo "image reports: ${got}"
          [ "$got" = "alumia ${{ needs.prepare.outputs.version }}" ] || {
            echo "::error::expected 'alumia ${{ needs.prepare.outputs.version }}'"
            exit 1
          }
          help=$(docker run --rm "${GHCR_IMAGE}:${IMAGE_TAG}" --help)
          case "$help" in
            *"  tui "*)
              echo "::error::container image exposes tui"
              exit 1
              ;;
            *serve-embedded*)
              echo "::error::container image exposes serve-embedded"
              exit 1
              ;;
          esac
          help=$(docker run --rm "${GHCR_IMAGE}:${IMAGE_TAG}" check-config --help)
          case "$help" in
            *--embedded*)
              echo "::error::container image exposes check-config --embedded"
              exit 1
              ;;
          esac

      - name: Push image
        if: needs.prepare.outputs.rehearsal == 'false'
        run: docker push "${GHCR_IMAGE}:${IMAGE_TAG}"

  # The per-arch tags above are plumbing; this is the tag users pull.
  docker-manifest:
    needs: [prepare, docker]
    if: needs.prepare.outputs.rehearsal == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the multi-arch manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # imagetools rather than `docker manifest create`, which refuses a
          # source that is itself an index: a runner whose docker keeps images
          # in containerd's store pushes one, the image beside its build
          # attestation, as the ubuntu-26.04 runners do.
          docker buildx imagetools create --tag "${GHCR_IMAGE}:${TAG}" \
            "${GHCR_IMAGE}:${TAG}-amd64" \
            "${GHCR_IMAGE}:${TAG}-arm64"

      # A prerelease is never `latest` — it is built off a non-main branch.
      - name: Point latest at this release
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${TAG}-amd64" \
            "${GHCR_IMAGE}:${TAG}-arm64"
