# cargo-about's settings for the web client's WebAssembly module
# (frontend/wasm/egfx), as packaging/about.toml is the gateway's: the crates the
# module compiles in, for the one target it is built for, under the licences the
# gateway's crates are accepted under.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "BSD-1-Clause",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
