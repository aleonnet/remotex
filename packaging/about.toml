# cargo-about's settings for packaging/third-party-notices.py: the crates a release
# build compiles into the gateway, on every platform it is released for, and a
# licence each may be taken under. For a crate offered under several licences the
# first of these that it offers is the one its notice gives.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "BSD-1-Clause",
  "OpenSSL",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
